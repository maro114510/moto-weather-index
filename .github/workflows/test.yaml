name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint code
        run: bunx biome check --config-path .biomerc.json .
      - name: Type check
        run: bunx tsc --noEmit
      - name: Validate Worker bundle
        run: bunx wrangler deploy --dry-run
      - name: Run unit tests
        run: bun test

  # External WeatherAPI calls never gate a pull request: they run on main and on
  # a manual dispatch, and report their own status.
  integration:
    name: WeatherAPI integration tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    env:
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      RUN_WEATHER_API_TESTS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run external WeatherAPI integration tests
        if: ${{ env.WEATHERAPI_KEY != '' }}
        run: bun test src/infra/WeatherApiWeatherRepository.test.ts
      - name: Report external tests as skipped
        if: ${{ env.WEATHERAPI_KEY == '' }}
        run: |
          echo "::notice::Skipped: WEATHERAPI_KEY is not available to this workflow run."

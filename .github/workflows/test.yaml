name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint code
        run: bunx biome check --config-path .biomerc.json .
      - name: Type check the Worker and the interface
        run: bun run typecheck
      - name: Build the interface and the Worker
        run: bun run build
      - name: Validate Worker bundle
        run: bunx wrangler deploy --dry-run
      - name: Run unit tests
        run: bun test
      # The default branch keeps the build it passed with, so a deployable
      # artifact exists without a provider credential.
      - name: Upload the build artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist
          include-hidden-files: true
          if-no-files-found: error
